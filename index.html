<h2>畢業專題 / Capstone Project</h2>
<div class="card">
<h3>MarVoiReflex：結合 Agentic AI 的數位行銷工作流程語音助理</h3>
<p><strong>專案簡介：</strong>針對小型商家社群行銷人員在每週貼文準備時反覆搜尋、比對與整理活動圖片與文案的痛點，以 Windows 本機 Agent 架構結合中文語音辨識、小型語言模型意圖理解與任務規劃模組，落實白名單工具受限操作與搬移前預覽確認機制，協助降低整理耗時與人為分類錯誤。</p>

<p><strong>團隊個人分工：</strong></p>
<ul>
<li>使用者需求訪談與問題分析（鎖定小型商家社群行銷情境）</li>
<li>行銷素材指令意圖理解與提示詞設計</li>
<li>專案研究資料整理與商業模式規劃 (BMC)</li>
</ul>

<p><strong>專案資源：</strong></p>
