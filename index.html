<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李心愉 | 個人專業主頁</title>
<style>
:root {
/* 科技極簡黑灰白配色 (無任何突兀藍色) */
--tech-black: #0f172a; /* 極深灰黑 (標題/線條) */
--tech-dark: #334155; /* 深灰 (主要文字) */
--tech-gray: #64748b; /* 中灰 (次要/敘述文字) */
--tech-light: #f1f5f9; /* 淺灰 (標籤底色) */
--bg-page: #f8fafc;
--card-bg: #ffffff;
--border-line: #e2e8f0;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
line-height: 1.6;
max-width: 920px;
margin: 40px auto;
padding: 0 20px;
color: var(--tech-dark);
background-color: var(--bg-page);
-webkit-font-smoothing: antialiased; /* 字體平滑、增加科技質感 */
}
.container {
background: var(--card-bg);
padding: 40px 48px;
border-radius: 8px;
border: 1px solid var(--border-line);
box-shadow: 0 4px 24px rgba(15, 23, 42, 0.04);
}

/* 頭部區塊 */
.header {
display: flex;
align-items: center;
gap: 32px;
border-bottom: 1px solid var(--border-line);
padding-bottom: 28px;
margin-bottom: 32px;
}
.profile-photo {
width: 120px;
height: 155px;
object-fit: cover;
border-radius: 6px;
border: 1px solid var(--border-line);
box-shadow: 0 2px 8px rgba(0,0,0,0.05);
flex-shrink: 0;
}
.header-info h1 {
margin: 0 0 8px 0;
font-size: 1.8rem;
color: var(--tech-black);
letter-spacing: -0.5px;
}
.header-info p {
margin: 4px 0;
color: var(--tech-gray);
font-size: 0.95rem;
}

/* 頂部標籤 */
.tags {
margin-top: 14px;
display: flex;
flex-wrap: wrap;
gap: 8px;
}
.tag {
background-color: var(--card-bg);
color: var(--tech-black);
border: 1px solid #cbd5e1;
padding: 3px 12px;
border-radius: 4px; /* 方正導角更具科技感 */
font-size: 0.8rem;
font-weight: 600;
}

/* 區塊標題 (極簡深灰線條) */
h2 {
color: var(--tech-black);
font-size: 1.2rem;
border-left: 3px solid var(--tech-black); /* 沉穩極簡黑線 */
padding-left: 12px;
margin-top: 40px;
margin-bottom: 16px;
font-weight: 600;
}

/* 卡片設計 */
.card {
background: #ffffff;
border: 1px solid var(--border-line);
border-radius: 6px;
padding: 24px 28px;
margin-bottom: 20px;
box-sizing: border-box;
}
.card h3 {
margin-top: 0;
color: var(--tech-black);
font-size: 1.1rem;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
margin-bottom: 12px;
}
.period {
font-size: 0.85rem;
color: var(--tech-gray);
font-weight: normal;
}
.badge {
background: var(--tech-light);
color: var(--tech-black);
border: 1px solid var(--border-line);
font-size: 0.75rem;
font-weight: 600;
padding: 2px 8px;
border-radius: 4px;
}

/* 工作經歷無點點設計 (科技感縮排) */
.exp-item {
margin-bottom: 14px;
padding-left: 14px;
border-left: 2px solid var(--border-line);
}
.exp-item:last-child {
margin-bottom: 0;
}
.exp-kw {
font-weight: 600;
color: var(--tech-black);
font-size: 0.95rem;
margin-bottom: 2px;
}
.exp-desc {
color: var(--tech-gray);
font-size: 0.92rem;
}

/* 專案簡介文字 */
.card p {
margin: 8px 0;
font-size: 0.93rem;
color: var(--tech-dark);
}

/* 畢業專題專用列點 (最簡化) */
.simple-list {
margin: 8px 0 0 0;
padding-left: 18px;
color: var(--tech-dark);
font-size: 0.93rem;
}
.simple-list li {
margin-bottom: 6px;
}

/* ★ 專案經歷：雙層排版，保證標籤在同一行 ★ */
.role-title {
font-size: 0.92rem;
font-weight: 600;
color: var(--tech-black);
margin: 12px 0 6px 0;
}
.tech-tags-row {
display: flex;
gap: 8px;
white-space: nowrap; /* 絕對不換行 */
}
.tech-tag {
background-color: var(--tech-light);
color: var(--tech-dark);
border: 1px solid var(--border-line);
padding: 2px 8px;
border-radius: 4px;
font-size: 0.8rem;
font-weight: 500;
}

/* 左右欄等高對齊排版 */
.equal-grid {
display: flex;
gap: 24px;
align-items: stretch;
}
.col-half {
flex: 1;
display: flex;
flex-direction: column;
min-width: 0;
}
.col-half .card {
flex: 1;
margin-bottom: 0;
display: flex;
flex-direction: column;
justify-content: space-between;
}

@media (max-width: 768px) {
.equal-grid {
flex-direction: column;
}
.header {
flex-direction: column;
text-align: center;
}
.tags {
justify-content: center;
}
.tech-tags-row {
flex-wrap: wrap; /* 手機版才允許換行 */
}
}
a {
color: var(--tech-black);
text-decoration: underline;
font-weight: 500;
}
a:hover {
color: var(--tech-gray);
}
.footer {
text-align: center;
margin-top: 48px;
font-size: 0.85rem;
color: var(--tech-gray);
}
</style>
</head>
