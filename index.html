<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071321">
    <title>李心愉｜個人履歷與專案作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #f4f6f8;
            color: #253342;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.75;
            font-size: 14px;
        }
        a {
            color: #1684a0;
            text-decoration: none;
            overflow-wrap: anywhere;
        }
        .wrap {
            max-width: 940px;
            margin: 30px auto;
            padding: 30px 34px;
            background: #fff;
            box-shadow: 0 8px 30px #1c344010;
        }
        .profile {
            display: grid;
            grid-template-columns: 112px 1fr;
            gap: 24px;
            align-items: center;
            padding: 0 0 25px;
            border-bottom: 1px solid #cfd8df;
        }
        .avatar {
            width: 108px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #cbd4dc;
            padding: 3px;
        }
        .intro h1 {
            font-size: 27px;
            margin: 0 0 8px;
            color: #253342;
        }
        .intro h1 span {
            font-size: 21px;
            color: #536779;
        }
        .intro p {
            font-size: 12px;
            margin: 2px 0;
            color: #53616e;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 13px;
        }
        .tags span {
            background: rgba(22, 132, 160, 0.05);
            color: #1684a0;
            border: 1px solid rgba(22, 132, 160, 0.25);
            padding: 4px 11px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: 500;
        }
        section {
            margin-top: 28px;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 13px;
            padding-left: 12px;
            border-left: 4px solid #168da4;
            color: #253342;
        }
        h3 {
            font-size: 15px;
            margin: 0;
            color: #253342;
        }
        .card {
            border: 1px solid #d6dfe5;
            border-radius: 5px;
            padding: 20px 22px;
            background: #fff;
        }
        .card p, .card li {
            font-size: 12px;
            color: #5b6874;
        }
        .card p {
            margin: 9px 0;
        }
        .card ul {
            padding-left: 19px;
            margin: 6px 0;
        }
        .card li {
            padding: 2px 0;
        }
        .card-heading {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .status {
            font-size: 11px;
            color: #18758a;
            background: #e6f3f5;
            padding: 3px 10px;
            border: 1px solid #c8e5e9;
        }
        .date {
            font-size: 11px;
            color: #82909b;
        }
        .role {
            margin-top: 13px;
        }
        .role p {
            margin: 2px 0;
        }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }
        .skill + .skill {
            margin-top: 62px;
        }
