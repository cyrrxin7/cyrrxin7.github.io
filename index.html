<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071321">
    <meta name="format-detection" content="telephone=no">
    <title>李心愉｜個人履歷與專案作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f8; color: #253342; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; line-height: 1.75; font-size: 14px; }
        a { color: #1684a0; text-decoration: none; overflow-wrap: anywhere; }
        .wrap { max-width: 940px; margin: 30px auto; padding: 30px 34px; background: #fff; box-shadow: 0 8px 30px #1c344010; }
        .profile { display: grid; grid-template-columns: 112px 1fr; gap: 24px; align-items: center; padding: 0 0 25px; border-bottom: 1px solid #cfd8df; }
        .avatar { width: 108px; height: 140px; object-fit: cover; border: 1px solid #cbd4dc; padding: 3px; }
        .intro h1 { font-size: 27px; margin: 0 0 8px; color: #253342; }
        .intro h1 span { font-size: 21px; color: #536779; }
        .intro p { font-size: 12px; margin: 2px 0; color: #53616e; }
        .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
        .tags span { background: rgba(22, 132, 160, 0.05); color: #1684a0; border: 1px solid rgba(22, 132, 160, 0.25); padding: 4px 11px; font-size: 11px; border-radius: 4px; font-weight: 500; }
        section { margin-top: 28px; }
        h2 { font-size: 18px; margin: 0 0 13px; padding-left: 12px; border-left: 4px solid #168da4; color: #253342; }
        h3 { font-size: 15px; margin: 0; color: #253342; }
        .card { border: 1px solid #d6dfe5; border-radius: 5px; padding: 20px 22px; background: #fff; }
        .card p, .card li { font-size: 12px; color: #5b6874; }
        .card p { margin: 9px 0; }
        .card ul { padding-left: 19px; margin: 6px 0; }
        .card li { padding: 2px 0; }
        .card-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
        .status { font-size: 11px; color: #18758a; background: #e6f3f5; padding: 3px 10px; border: 1px solid #c8e5e9; }
        .date { font-size: 11px; color: #82909b; }
        .role { margin-top: 13px; }
        .role p { margin: 2px 0; }
        
        /* 左右欄等高對齊設定：讓左右框框外觀絕對一模一樣長 */
        .columns { display: flex; gap: 22px; align-items: stretch; margin-top: 28px; }
        .col-half { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .col-half h2 { margin-top: 0; margin-bottom: 13px; }
        .col-half .card { flex: 1; display: flex; flex-direction: column; }
        
        .skill + .skill { margin-top: 24px; }
        .skill h3 { font-size: 13px; }
        .skill ul { margin-top: 4px; }
        .mini-project + .mini-project { margin-top: 19px; padding-top: 17px; border-top: 1px solid #e2e8ed; }
        .mini-project h3 { font-size: 13px; }
        .mini-project p { margin: 6px 0; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips span { font-size: 10px; color: #1684a0; border: 1px solid rgba(22, 132, 160, 0.22); background: rgba(241, 248, 250, 0.6); padding: 3px 8px; border-radius: 4px; font-weight: 500; }
        .footer { text-align: center; color: #9aa5ad; font-size: 10px; padding: 25px 0 0; }
        
        @media(max-width: 650px) {
            .wrap { margin: 0; padding: 22px 17px; }
            .profile { grid-template-columns: 82px 1fr; gap: 14px; }
            .avatar { width: 80px; height: 108px; }
            .intro h1 { font-size: 21px; }
            .intro h1 span { font-size: 15px; }
            .columns { flex-direction: column; }
            .col-half { margin-top: 28px; }
            .col-half:first-child { margin-top: 0; }
            .col-half .card { flex: unset; }
            .card { padding: 16px; }
        }
    </style>
</head>
