<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李心愉 | 個人專業主頁</title>
<style>
:root {
/* 科技智庫/數據網絡專屬配色 (對標工研院風格) */
--tech-dark: #0f172a; /* 深石板灰 (西裝與地圖色 - 用於標題，展現極致沉穩) */
--tech-cyan: #0ea5e9; /* 科技青/亮藍 (數據發光連線色 - 用於重點點綴) */
--tech-text: #334155; /* 內文深灰 */
--tech-gray: #64748b; /* 輔助說明中灰 */
--bg-page: #f4f5f7; /* 帶有工業冷調的極淺灰底 */
--card-bg: #ffffff;
--border-line: #cbd5e1; /* 乾淨俐落的邊框灰 */
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
line-height: 1.6;
max-width: 920px;
margin: 40px auto;
padding: 0 20px;
color: var(--tech-text);
background-color: var(--bg-page);
-webkit-font-smoothing: antialiased;
}
.container {
background: var(--card-bg);
padding: 40px 48px;
border-radius: 8px;
border: 1px solid var(--border-line);
box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); /* 輕微高質感陰影 */
}

/* 頭部區塊 */
.header {
display: flex;
align-items: center;
gap: 32px;
border-bottom: 1px solid var(--border-line);
padding-bottom: 28px;
margin-bottom: 32px;
}
.profile-photo {
width: 120px;
height: 155px;
object-fit: cover;
border-radius: 6px;
border: 1px solid var(--border-line);
box-shadow: 0 2px 8px rgba(0,0,0,0.05);
flex-shrink: 0;
}
.header-info h1 {
margin: 0 0 8px 0;
font-size: 1.85rem;
color: var(--tech-dark);
letter-spacing: -0.5px;
}
.header-info p {
margin: 4px 0;
color: var(--tech-gray);
font-size: 0.95rem;
}

/* 頂部科技感標籤 (深底+螢光字，模擬數據節點) */
.tags {
margin-top: 14px;
display: flex;
flex-wrap: wrap;
gap: 8px;
}
.tag {
background-color: var(--tech-dark);
color: #38bdf8; /* 高亮度科技青 */
border: 1px solid #1e293b;
padding: 3px 12px;
border-radius: 4px;
font-size: 0.8rem;
font-weight: 600;
box-shadow: 0 2px 4px rgba(14, 165, 233, 0.1);
}

/* 區塊標題 (科技亮藍點綴線) */
h2 {
color: var(--tech-dark);
font-size: 1.25rem;
border-left: 4px solid var(--tech-cyan); /* 發光數據連線色 */
padding-left: 12px;
margin-top: 40px;
margin-bottom: 16px;
font-weight: 600;
}

/* 卡片設計 */
.card {
background: #ffffff;
border: 1px solid var(--border-line);
border-radius: 6px;
padding: 24px 28px;
margin-bottom: 20px;
box-sizing: border-box;
}
.card h3 {
margin-top: 0;
color: var(--tech-dark);
font-size: 1.1rem;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
margin-bottom: 12px;
}
.period {
font-size: 0.85rem;
color: var(--tech-gray);
font-weight: normal;
}

/* 進行中 Badge */
.badge {
background: #f0f9ff;
color: #0284c7;
border: 1px solid #bae6fd;
font-size: 0.75rem;
font-weight: 600;
padding: 2px 8px;
border-radius: 4px;
}

/* 工作經歷縮排設計 */
.exp-item {
margin-bottom: 14px;
padding-left: 14px;
border-left: 2px solid var(--border-line);
}
.exp-item:last-child {
margin-bottom: 0;
}
.exp-kw {
font-weight: 600;
color: var(--tech-dark);
font-size: 0.95rem;
margin-bottom: 2px;
}
.exp-desc {
color: var(--tech-gray);
font-size: 0.92rem;
}

/* 專案簡介文字 */
.card p {
margin: 8px 0;
font-size: 0.93rem;
color: var(--tech-text);
}

/* 畢業專題專用列點 */
.simple-list {
margin: 8px 0 0 0;
padding-left: 18px;
color: var(--tech-text);
font-size: 0.93rem;
}
.simple-list li {
margin-bottom: 6px;
}

/* ★ 專案經歷：雙層排版，保證標籤在同一行 ★ */
.role-title {
font-size: 0.92rem;
font-weight: 600;
color: var(--tech-dark);
margin: 12px 0 6px 0;
}
.tech-tags-row {
display: flex;
gap: 8px;
white-space: nowrap; /* 絕對不換行 */
}
.tech-tag {
