<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李心愉 | 個人專業主頁</title>
<style>
:root {
--primary: #1e3a8a;
--primary-light: #2563eb;
--text-main: #1f2937;
--text-sub: #4b5563;
--bg-page: #f8fafc;
--card-bg: #ffffff;
--border-color: #e2e8f0;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
line-height: 1.6;
max-width: 920px;
margin: 30px auto;
padding: 0 20px;
color: var(--text-main);
background-color: var(--bg-page);
}
.container {
background: var(--card-bg);
padding: 36px 40px;
border-radius: 12px;
border: 1px solid var(--border-color);
box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
}
.header {
display: flex;
align-items: center;
gap: 28px;
border-bottom: 2px solid #edf2f7;
padding-bottom: 24px;
margin-bottom: 28px;
}
.profile-photo {
width: 125px;
height: 160px;
object-fit: cover;
border-radius: 10px;
border: 1px solid var(--border-color);
box-shadow: 0 2px 6px rgba(0,0,0,0.06);
flex-shrink: 0;
}
.header-info h1 {
margin: 0 0 6px 0;
font-size: 1.85rem;
color: var(--primary);
}
.header-info p {
margin: 4px 0;
color: var(--text-sub);
font-size: 0.95rem;
}
.tags {
margin-top: 12px;
display: flex;
flex-wrap: wrap;
gap: 8px;
}
.tag {
background-color: #eff6ff;
color: var(--primary-light);
border: 1px solid #dbeafe;
padding: 3px 10px;
border-radius: 14px;
font-size: 0.8rem;
font-weight: 600;
}
h2 {
color: var(--primary);
font-size: 1.25rem;
border-left: 4px solid var(--primary-light);
padding-left: 10px;
margin-top: 32px;
margin-bottom: 16px;
}
.card {
background: #ffffff;
border: 1px solid var(--border-color);
border-radius: 10px;
padding: 20px 24px;
margin-bottom: 18px;
box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
box-sizing: border-box;
}
.card h3 {
margin-top: 0;
color: #1e293b;
font-size: 1.12rem;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
}
.period {
font-size: 0.85rem;
color: #64748b;
font-weight: normal;
}
.badge {
background: #e0f2fe;
color: #0369a1;
font-size: 0.75rem;
font-weight: 600;
padding: 2px 8px;
border-radius: 6px;
}
.card p {
margin: 8px 0;
font-size: 0.93rem;
color: var(--text-sub);
text-align: justify;
}
ul {
margin: 8px 0;
padding-left: 20px;
color: var(--text-sub);
font-size: 0.93rem;
}
li {
margin-bottom: 6px;
}

/* 左右欄等高對齊排版 */
.equal-grid {
display: flex;
gap: 20px;
align-items: stretch;
}
.col-half {
flex: 1;
display: flex;
flex-direction: column;
}
.col-half .card {
flex: 1;
margin-bottom: 0;
display: flex;
flex-direction: column;
justify-content: space-between;
}

@media (max-width: 768px) {
.equal-grid {
flex-direction: column;
}
.header {
flex-direction: column;
text-align: center;
}
.tags {
justify-content: center;
}
}
a {
color: var(--primary-light);
text-decoration: none;
font-weight: 500;
}
a:hover {
text-decoration: underline;
}
.footer {
text-align: center;
margin-top: 40px;
font-size: 0.85rem;
color: #94a3b8;
}
</style>
</head>
