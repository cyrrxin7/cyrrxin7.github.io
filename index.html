<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李心愉 | 個人專業主頁</title>
<style>
:root {
/* 科技感沉穩配色：深石板灰與靛青點綴 */
--primary: #4338ca; /* 科技感靛青 */
--text-dark: #0f172a; /* 極深灰黑 (標題用) */
--text-main: #334155; /* 主內文深灰 */
--text-sub: #64748b; /* 輔助文字淺灰 */
--bg-page: #f8fafc;
--card-bg: #ffffff;
--border-light: #e2e8f0;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
line-height: 1.6;
max-width: 920px;
margin: 40px auto;
padding: 0 20px;
color: var(--text-main);
background-color: var(--bg-page);
-webkit-font-smoothing: antialiased; /* 讓字體更平滑有質感 */
}
.container {
background: var(--card-bg);
padding: 40px 48px;
border-radius: 8px;
border: 1px solid var(--border-light);
box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03); /* 極微弱的陰影，增加立體感但不髒 */
}

/* 頭部區塊 */
.header {
display: flex;
align-items: center;
gap: 32px;
border-bottom: 1px solid var(--border-light);
padding-bottom: 28px;
margin-bottom: 32px;
}
.profile-photo {
width: 120px;
height: 155px;
object-fit: cover;
border-radius: 6px;
border: 1px solid var(--border-light);
box-shadow: 0 2px 8px rgba(0,0,0,0.04);
flex-shrink: 0;
}
.header-info h1 {
margin: 0 0 8px 0;
font-size: 1.8rem;
color: var(--text-dark);
letter-spacing: -0.5px; /* 稍微緊縮字距，增加科技俐落感 */
}
.header-info p {
margin: 4px 0;
color: var(--text-sub);
font-size: 0.95rem;
}

/* 頂部科技感標籤 */
.tags {
margin-top: 14px;
display: flex;
flex-wrap: wrap;
gap: 8px;
}
.tag {
background-color: transparent;
color: var(--text-main);
border: 1px solid #cbd5e1;
padding: 3px 12px;
border-radius: 20px;
font-size: 0.8rem;
font-weight: 500;
}

/* 區塊標題 */
h2 {
color: var(--text-dark);
font-size: 1.2rem;
border-left: 4px solid var(--primary); /* 靛青色左邊框 */
padding-left: 12px;
margin-top: 36px;
margin-bottom: 16px;
font-weight: 600;
}

/* 卡片設計：極簡化 */
.card {
background: #ffffff;
border: 1px solid var(--border-light);
border-radius: 6px;
padding: 22px 26px;
margin-bottom: 20px;
box-sizing: border-box;
}
.card h3 {
margin-top: 0;
color: var(--text-dark);
font-size: 1.1rem;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
margin-bottom: 10px;
}
.period {
font-size: 0.85rem;
color: var(--text-sub);
font-weight: normal;
}
.badge {
background: #eef2ff; /* 極淡的靛青背景 */
color: var(--primary);
font-size: 0.75rem;
font-weight: 600;
padding: 2px 8px;
border-radius: 4px;
}
.card p {
margin: 8px 0;
font-size: 0.93rem;
color: var(--text-main);
}
